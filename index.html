<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
        }

        #controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #country-selector, #category-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        #country-selector button, #category-selector button {
            padding: 5px 10px;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 14px;
        }

        #country-selector button.active, #category-selector button.active {
            background-color: #0078d7;
        }

        #channel-list {
            padding: 10px;
            list-style-type: none;
            margin: 0;
            padding-left: 0;
            overflow-y: auto;
            height: calc(100vh - 150px);
        }

        #channel-list li {
            padding: 5px;
            cursor: pointer;
        }

        #channel-list li:hover {
            background-color: #ddd;
        }

        #main-video-container {
            width: 100%;
            height: calc(100vh - 200px);
        }

        #main-video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="main-video-container">
    <video id="main-video" controls autoplay muted></video>
</div>

<div id="controls">
    <div id="country-selector">
        <span>Страна:</span>
    </div>
    <div id="category-selector">
        <span>Категория:</span>
    </div>
</div>

<ul id="channel-list"></ul>

<script>
    const mainVideo = document.getElementById('main-video');
    const countrySelector = document.getElementById('country-selector');
    const categorySelector = document.getElementById('category-selector');
    const channelList = document.getElementById('channel-list');

    let channels = [];
    let currentChannelIndex = 0;

    // Загрузка плейлиста
    fetch('combined.m3u')
        .then(response => response.text())
        .then(data => {
            const lines = data.split('\n');
            let currentGroup = null;

            for (const line of lines) {
                if (line.startsWith('#EXTINF')) {
                    const match = line.match(/#EXTINF:-1 tvg-id="(.*?)".*?,(.*)/);
                    if (match) {
                        const [, tvgId, name] = match;
                        currentGroup = { name, tvgId };
                    }
                } else if (line.startsWith('http')) {
                    channels.push({ ...currentGroup, url: line });
                }
            }

            console.log('Каналы загружены:', channels);

            // Создание кнопок для стран
            const countries = [...new Set(channels.map(channel => channel.tvgId.split('.')[0]))];
            countries.forEach(country => {
                const button = document.createElement('button');
                button.textContent = country;
                button.addEventListener('click', () => filterChannelsByCountry(country));
                countrySelector.appendChild(button);
            });

            // Создание кнопок для категорий
            const categories = [...new Set(channels.map(channel => channel.name))];
            categories.forEach(category => {
                const button = document.createElement('button');
                button.textContent = category;
                button.addEventListener('click', () => filterChannelsByCategory(category));
                categorySelector.appendChild(button);
            });

            // Изначальный отображение всех каналов
            loadChannelList();
        })
        .catch(error => console.error('Ошибка при загрузке плейлиста:', error));

    // Фильтрация каналов по стране
    function filterChannelsByCountry(country) {
        const filteredChannels = channels.filter(channel => channel.tvgId.startsWith(country));
        loadChannelList(filteredChannels);
    }

    // Фильтрация каналов по категории
    function filterChannelsByCategory(category) {
        const filteredChannels = channels.filter(channel => channel.name === category);
        loadChannelList(filteredChannels);
    }

    // Обновление списка каналов
    function loadChannelList(filteredChannels = channels) {
        channelList.innerHTML = '';
        filteredChannels.forEach((channel, index) => {
            const listItem = document.createElement('li');
            listItem.textContent = channel.name;
            listItem.dataset.index = index;
            listItem.addEventListener('click', () => selectChannel(index));
            channelList.appendChild(listItem);
        });
    }

    // Переключение канала
    function selectChannel(index) {
        const selectedChannel = channels[index];
        mainVideo.src = selectedChannel.url;
        mainVideo.load();
        mainVideo.play();
    }
</script>

</body>
</html>
