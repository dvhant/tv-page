<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
        }

        #main-video-container {
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: hidden;
        }

        #main-video {
            width: 100%;
            height: auto;
        }

        #controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #controls button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        #right-panel {
            width: 100%;
            height: 40vh;
            background-color: #f9f9f9;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        #country-selector, #category-selector {
            margin-bottom: 10px;
        }

        #country-selector button, #category-selector button {
            margin: 0 5px;
            padding: 5px 10px;
            border: 1px solid #000;
            background-color: #fff;
            cursor: pointer;
        }

        #channel-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        #channel-list li {
            padding: 5px 0;
            cursor: pointer;
        }

        #channel-list li:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>
<body>

<div id="main-video-container">
    <video id="main-video" controls autoplay muted></video>
</div>

<div id="controls">
    <button id="prev-channel">CH-</button>
    <button id="next-channel">CH+</button>
</div>

<div id="right-panel">
    <!-- Выбор страны -->
    <div id="country-selector">
        <label for="country-select">Выберите страну:</label>
        <button data-country="all">Все страны</button>
        <button data-country="Russia">Россия</button>
        <button data-country="China">Китай</button>
        <button data-country="United States">США</button>
        <button data-country="Mexico">Мексика</button>
        <button data-country="Dominican Republic">Доминиканская Республика</button>
        <button data-country="Colombia">Колумбия</button>
        <button data-country="India">Индия</button>
        <button data-country="Iran">Иран</button>
        <button data-country="Iraq">Ирак</button>
        <button data-country="Israel">Израиль</button>
        <button data-country="Turkey">Турция</button>
        <button data-country="Brazil">Бразилия</button>
        <button data-country="Venezuela">Венесуэла</button>
        <button data-country="Ecuador">Эквадор</button>
        <button data-country="Kazakhstan">Казахстан</button>
        <button data-country="Kyrgyzstan">Киргизия</button>
        <button data-country="Cuba">Куба</button>
        <button data-country="Armenia">Армения</button>
        <button data-country="Belize">Белиз</button>
        <button data-country="Belgium">Бельгия</button>
        <button data-country="Bulgaria">Болгария</button>
        <button data-country="Canada">Канада</button>
        <button data-country="France">Франция</button>
        <button data-country="Germany">Германия</button>
        <button data-country="Italy">Италия</button>
        <button data-country="Netherlands">Нидерланды</button>
        <button data-country="Spain">Испания</button>
        <button data-country="United Kingdom">Великобритания</button>
        <button data-country="Vietnam">Вьетнам</button>
    </div>

    <!-- Выбор категории -->
    <div id="category-selector">
        <label for="category-select">Выберите категорию:</label>
        <button data-category="all">Все категории</button>
        <button data-category="General">Общие</button>
        <button data-category="News">Новости</button>
        <button data-category="Entertainment">Развлечения</button>
        <button data-category="Sports">Спорт</button>
        <button data-category="Music">Музыка</button>
        <button data-category="Education">Образование</button>
        <button data-category="Religion">Религия</button>
        <button data-category="Children">Детям</button>
        <button data-category="Lifestyle">Жизнь</button>
        <button data-category="Technology">Технологии</button>
    </div>

    <!-- Список каналов -->
    <ul id="channel-list"></ul>
</div>

<script>
    const mainVideo = document.getElementById('main-video');
    const prevButton = document.getElementById('prev-channel');
    const nextButton = document.getElementById('next-channel');
    const countrySelector = document.getElementById('country-selector');
    const categorySelector = document.getElementById('category-selector');
    const channelList = document.getElementById('channel-list');

    let channels = [];
    let currentChannelIndex = 0;

    // Загрузка плейлиста из файла combined.m3u
    fetch('combined.m3u.txt')
        .then(response => response.text())
        .then(data => {
            const lines = data.split('\n');
            let currentGroup = null;

            for (const line of lines) {
                if (line.startsWith('#EXTINF')) {
                    const [, tvgLogo, name, tvgId] = line.match(/#EXTINF:-1 tvg-logo="(.*?)".*?tvg-id="(.*?)".*?,(.*)/) || [];
                    currentGroup = { name, tvgId, tvgLogo };
                } else if (line.startsWith('http')) {
                    channels.push({ ...currentGroup, url: line });
                }
            }

            console.log('Каналы загружены:', channels);

            // Инициализация списка каналов
            loadChannelList();
        })
        .catch(error => console.error('Ошибка при загрузке плейлиста:', error));

    function loadChannelList() {
        channelList.innerHTML = '';

        const selectedCountry = getSelectedCountry();
        const selectedCategory = getSelectedCategory();

        channels.forEach(channel => {
            if ((selectedCountry === 'all' || channel.tvgId.includes(selectedCountry)) &&
                (selectedCategory === 'all' || channel.tvgId.includes(selectedCategory))) {
                const listItem = document.createElement('li');
                listItem.textContent = channel.name;
                listItem.dataset.url = channel.url;
                listItem.dataset.country = channel.tvgId;
                listItem.dataset.category = channel.tvgId;
                listItem.addEventListener('click', () => selectChannel(listItem.dataset.url));
                channelList.appendChild(listItem);
            }
        });
    }

    function selectChannel(url) {
        mainVideo.src = url;
        mainVideo.load();
        mainVideo.controls = true;
        mainVideo.autoplay = true;
        mainVideo.muted = false;
    }

    function getSelectedCountry() {
        const selectedButton = Array.from(countrySelector.children).find(button => button.classList.contains('active'));
        return selectedButton ? selectedButton.dataset.country : 'all';
    }

    function getSelectedCategory() {
        const selectedButton = Array.from(categorySelector.children).find(button => button.classList.contains('active'));
        return selectedButton ? selectedButton.dataset.category : 'all';
    }

    // Обработчики кнопок переключения страны
    countrySelector.addEventListener('click', event => {
        if (event.target.tagName === 'BUTTON') {
            Array.from(countrySelector.children).forEach(button => button.classList.remove('active'));
            event.target.classList.add('active');
            loadChannelList();
        }
    });

    // Обработчики кнопок переключения категории
    categorySelector.addEventListener('click', event => {
        if (event.target.tagName === 'BUTTON') {
            Array.from(categorySelector.children).forEach(button => button.classList.remove('active'));
            event.target.classList.add('active');
            loadChannelList();
        }
    });

    // Обработчики кнопок переключения основного канала
    prevButton.addEventListener('click', () => {
        currentChannelIndex = (currentChannelIndex - 1 + channels.length) % channels.length;
        selectChannel(channels[currentChannelIndex].url);
    });

    nextButton.addEventListener('click', () => {
        currentChannelIndex = (currentChannelIndex + 1) % channels.length;
        selectChannel(channels[currentChannelIndex].url);
    });

    // Загрузка первого канала по умолчанию
    window.onload = () => {
        selectChannel(channels[0].url);
        Array.from(countrySelector.children).forEach(button => button.classList.remove('active'));
        countrySelector.firstElementChild.classList.add('active');
        Array.from(categorySelector.children).forEach(button => button.classList.remove('active'));
        categorySelector.firstElementChild.classList.add('active');
    };
</script>

</body>
</html>
