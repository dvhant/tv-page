<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            display: flex;
        }

        #main-video-container {
            flex: 3;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #right-panel {
            flex: 1;
            background-color: #222;
            overflow-y: auto;
            color: white;
            display: flex;
            flex-direction: column;
        }

        #playlist-selector {
            padding: 10px;
            border-bottom: 1px solid #444;
            background-color: #333;
        }

        #playlist-selector select {
            width: 100%;
            padding: 8px;
            background-color: #444;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }

        #country-selector, #category-selector {
            padding: 10px;
            border-bottom: 1px solid #444;
        }

        .selector-title {
            margin-bottom: 10px;
            font-weight: bold;
        }

        .selector-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        #country-selector button, #category-selector button {
            padding: 5px 10px;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
        }

        #country-selector button:hover, #category-selector button:hover {
            background-color: #444;
        }

        #country-selector button.active, #category-selector button.active {
            background-color: #0078d7;
        }

        #channel-list {
            padding: 10px;
            list-style-type: none;
            margin: 0;
            padding-left: 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        #channel-list li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
        }

        #channel-list li:hover {
            background-color: #333;
        }

        #channel-list li.active {
            background-color: #0078d7;
        }

        .channel-logo {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            object-fit: contain;
        }

        .channel-name {
            flex-grow: 1;
        }

        #channel-controls {
            padding: 10px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
        }

        #channel-controls button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 3px;
        }

        #channel-controls button:hover {
            background-color: #0066c0;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="main-video-container">
    <video id="main-video" controls autoplay></video>
</div>

<div id="right-panel">
    <!-- Выбор плейлиста -->
    <div id="playlist-selector">
        <select id="playlist-select">
            <option value="">Поиск плейлистов...</option>
        </select>
    </div>

    <!-- Выбор страны -->
    <div id="country-selector">
        <div class="selector-title">Страны</div>
        <div class="selector-buttons">
            <button data-country="Все">Все</button>
            <button data-country="Россия">Россия</button>
            <button data-country="Украина">Украина</button>
            <button data-country="Беларусь">Беларусь</button>
            <button data-country="Казахстан">Казахстан</button>
            <button data-country="США">США</button>
            <button data-country="Великобритания">Великобритания</button>
            <button data-country="Германия">Германия</button>
            <button data-country="Франция">Франция</button>
            <button data-country="Италия">Италия</button>
            <button data-country="Испания">Испания</button>
            <button data-country="Турция">Турция</button>
            <button data-country="Китай">Китай</button>
            <button data-country="Япония">Япония</button>
            <button data-country="Корея">Корея</button>
            <button data-country="Индия">Индия</button>
            <button data-country="Арабские">Арабские</button>
            <button data-country="Латинская Америка">Латинская Америка</button>
        </div>
    </div>

    <!-- Выбор категории -->
    <div id="category-selector">
        <div class="selector-title">Категории</div>
        <div class="selector-buttons">
            <button data-category="Все">Все</button>
            <button data-category="Новости">Новости</button>
            <button data-category="Спорт">Спорт</button>
            <button data-category="Кино">Кино</button>
            <button data-category="Музыка">Музыка</button>
            <button data-category="Детские">Детские</button>
            <button data-category="Познавательные">Познавательные</button>
            <button data-category="Развлекательные">Развлекательные</button>
            <button data-category="Региональные">Региональные</button>
            <button data-category="Религия">Религия</button>
            <button data-category="Эротика">Эротика</button>
        </div>
    </div>

    <!-- Список каналов -->
    <ul id="channel-list"></ul>

    <!-- Управление каналами -->
    <div id="channel-controls">
        <button id="prev-channel">◄ Назад</button>
        <button id="next-channel">Вперед ►</button>
    </div>
</div>

<script>
    const mainVideo = document.getElementById('main-video');
    const prevButton = document.getElementById('prev-channel');
    const nextButton = document.getElementById('next-channel');
    const countrySelector = document.getElementById('country-selector');
    const categorySelector = document.getElementById('category-selector');
    const channelList = document.getElementById('channel-list');
    const playlistSelect = document.getElementById('playlist-select');

    let channels = [];
    let filteredChannels = [];
    let currentChannelIndex = 0;
    let availablePlaylists = [];

    // Список возможных имен плейлистов для поиска
    const PLAYLIST_NAMES = [
        'playlist.m3u', 'playlist.m3u8', 
        'all.m3u', 'all.m3u8',
        'tv.m3u', 'tv.m3u8', 
        'channels.m3u', 'channels.m3u8',
        'iptv.m3u', 'iptv.m3u8', 
        'combined.m3u', 'combined.m3u8',
        'list.m3u', 'list.m3u8',
        'streams.m3u', 'streams.m3u8',
        'live.m3u', 'live.m3u8',
'ru.m3u',
'ru_bonustv.m3u',
'ru_catcast.m3u',
'ru_ntv.m3u',
'ru_rt.m3u',
'ru_s18209.m3u',
'ru_smotrim.m3u',
'ru_televizor-24.m3u',
'ru_tvteleport.m3u',
'ru_zabava.m3u'
    ];

    // Загрузка списка доступных плейлистов
    async function loadPlaylists() {
        playlistSelect.innerHTML = '<option value="">Поиск плейлистов <span class="loading"></span></option>';
        
        // Проверяем каждый возможный плейлист
        const checks = PLAYLIST_NAMES.map(name => checkPlaylistExists(name));
        
        try {
            const results = await Promise.all(checks);
            availablePlaylists = results.filter(Boolean);
            
            updatePlaylistSelector();
            
            if (availablePlaylists.length > 0) {
                // Загружаем первый плейлист по умолчанию
                loadPlaylist(availablePlaylists[0]);
            } else {
                playlistSelect.innerHTML = '<option value="">Плейлисты не найдены</option>';
            }
        } catch (error) {
            console.error('Ошибка при поиске плейлистов:', error);
            playlistSelect.innerHTML = '<option value="">Ошибка поиска плейлистов</option>';
        }
    }

    // Проверяет существование плейлиста
    async function checkPlaylistExists(name) {
        try {
            const response = await fetch(name, { method: 'HEAD' });
            if (response.ok) {
                return name;
            }
            return null;
        } catch {
            return null;
        }
    }

    function updatePlaylistSelector() {
        playlistSelect.innerHTML = '';
        
        if (availablePlaylists.length === 0) {
            playlistSelect.innerHTML = '<option value="">Плейлисты не найдены</option>';
            return;
        }
        
        availablePlaylists.forEach(playlist => {
            const option = document.createElement('option');
            option.value = playlist;
            option.textContent = playlist;
            playlistSelect.appendChild(option);
        });
    }

    // Загрузка выбранного плейлиста
    async function loadPlaylist(playlistName) {
        channelList.innerHTML = '<li>Загрузка каналов...</li>';
        mainVideo.src = '';
        
        try {
            const response = await fetch(playlistName);
            if (!response.ok) throw new Error('Ошибка загрузки');
            
            const data = await response.text();
            const lines = data.split('\n');
            let currentChannel = null;
            channels = [];

            for (const line of lines) {
                if (line.startsWith('#EXTINF')) {
                    const match = line.match(/#EXTINF:-1(.*?),(.*)/);
                    if (match) {
                        const params = match[1];
                        const name = match[2].trim();
                        
                        const logoMatch = params.match(/tvg-logo="(.*?)"/);
                        const groupMatch = params.match(/group-title="(.*?)"/);
                        
                        currentChannel = {
                            name: name,
                            logoUrl: logoMatch ? logoMatch[1] : '',
                            group: groupMatch ? groupMatch[1] : '',
                            country: extractCountry(name, groupMatch ? groupMatch[1] : ''),
                            category: extractCategory(name, groupMatch ? groupMatch[1] : '')
                        };
                    }
                } else if (line.startsWith('http') && currentChannel) {
                    currentChannel.url = line.trim();
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }

            console.log(`Плейлист "${playlistName}" загружен, каналов: ${channels.length}`);
            
            // Активируем кнопку "Все" по умолчанию
            document.querySelector('#country-selector button[data-country="Все"]').classList.add('active');
            document.querySelector('#category-selector button[data-category="Все"]').classList.add('active');
            
            // Инициализация списка каналов
            loadChannelList();
        } catch (error) {
            console.error(`Ошибка при загрузке плейлиста "${playlistName}":`, error);
            channelList.innerHTML = '<li>Ошибка загрузки плейлиста</li>';
        }
    }

    // Функции для определения страны и категории
    function extractCountry(name, group) {
        const countryKeywords = [
            'Россия', 'Русский', 'RUS', 'RU ', 'Russia',
            'Украина', 'Украин', 'UKR', 'UA ',
            'Беларусь', 'Белорус', 'BY ',
            'Казахстан', 'KZ ',
            'США', 'USA', 'Американ',
            'Великобритания', 'UK ', 'Английск',
            'Германия', 'DE ', 'Немецк',
            'Франция', 'FR ', 'Французск',
            'Италия', 'IT ', 'Итальянск',
            'Испания', 'ES ', 'Испанск',
            'Турция', 'TR ', 'Турецк',
            'Китай', 'CN ', 'Китайск',
            'Япония', 'JP ', 'Японск',
            'Корея', 'KR ', 'Корейск',
            'Индия', 'IN ', 'Индийск',
            'Арабск', 'Arab', 'Arabic',
            'Латинск', 'Latin'
        ];
        
        for (const keyword of countryKeywords) {
            if (name.includes(keyword) || group.includes(keyword)) {
                if (keyword === 'Русский' || keyword === 'RUS' || keyword === 'RU ' || keyword === 'Russia') return 'Россия';
                if (keyword === 'Украин' || keyword === 'UKR' || keyword === 'UA ') return 'Украина';
                if (keyword === 'Белорус' || keyword === 'BY ') return 'Беларусь';
                if (keyword === 'KZ ') return 'Казахстан';
                if (keyword === 'USA' || keyword === 'Американ') return 'США';
                if (keyword === 'UK ' || keyword === 'Английск') return 'Великобритания';
                if (keyword === 'DE ' || keyword === 'Немецк') return 'Германия';
                if (keyword === 'FR ' || keyword === 'Французск') return 'Франция';
                if (keyword === 'IT ' || keyword === 'Итальянск') return 'Италия';
                if (keyword === 'ES ' || keyword === 'Испанск') return 'Испания';
                if (keyword === 'TR ' || keyword === 'Турецк') return 'Турция';
                if (keyword === 'CN ' || keyword === 'Китайск') return 'Китай';
                if (keyword === 'JP ' || keyword === 'Японск') return 'Япония';
                if (keyword === 'KR ' || keyword === 'Корейск') return 'Корея';
                if (keyword === 'IN ' || keyword === 'Индийск') return 'Индия';
                if (keyword === 'Arab' || keyword === 'Arabic') return 'Арабские';
                if (keyword === 'Latin') return 'Латинская Америка';
                return keyword;
            }
        }
        
        return 'Другие';
    }

    function extractCategory(name, group) {
        const categoryKeywords = [
            'Новости', 'News', 'Информац', '24/7',
            'Спорт', 'Sport', 'Футбол', 'Хоккей', 'Теннис',
            'Кино', 'Фильм', 'Movie', 'Cinema', 'Сериал',
            'Музыка', 'Music', 'MTV', 'Музыкальн',
            'Детск', 'Kids', 'Мульт', 'Cartoon',
            'Познавательн', 'Научн', 'Документальн', 'History', 'Discovery',
            'Развлекательн', 'Entertainment', 'Шоу', 'Юмор',
            'Региональн', 'Областн', 'Городск',
            'Религи', 'Церков', 'Правосл', 'Христиан', 'Мусульман',
            'Эротик', 'Для взрослых', '18+', 'Adult'
        ];
        
        for (const keyword of categoryKeywords) {
            if (name.includes(keyword) || group.includes(keyword)) {
                if (keyword === 'News' || keyword === 'Информац' || keyword === '24/7') return 'Новости';
                if (keyword === 'Sport' || keyword === 'Футбол' || keyword === 'Хоккей' || keyword === 'Теннис') return 'Спорт';
                if (keyword === 'Фильм' || keyword === 'Movie' || keyword === 'Cinema' || keyword === 'Сериал') return 'Кино';
                if (keyword === 'Music' || keyword === 'MTV' || keyword === 'Музыкальн') return 'Музыка';
                if (keyword === 'Kids' || keyword === 'Мульт' || keyword === 'Cartoon') return 'Детские';
                if (keyword === 'Научн' || keyword === 'Документальн' || keyword === 'History' || keyword === 'Discovery') return 'Познавательные';
                if (keyword === 'Entertainment' || keyword === 'Шоу' || keyword === 'Юмор') return 'Развлекательные';
                if (keyword === 'Областн' || keyword === 'Городск') return 'Региональные';
                if (keyword === 'Церков' || keyword === 'Правосл' || keyword === 'Христиан' || keyword === 'Мусульман') return 'Религия';
                if (keyword === 'Для взрослых' || keyword === '18+' || keyword === 'Adult') return 'Эротика';
                return keyword;
            }
        }
        
        return 'Другие';
    }

    function loadChannelList() {
        channelList.innerHTML = '';

        const selectedCountry = countrySelector.querySelector('.active')?.dataset.country || 'Все';
        const selectedCategory = categorySelector.querySelector('.active')?.dataset.category || 'Все';

        filteredChannels = channels.filter(channel => {
            const countryMatch = selectedCountry === 'Все' || 
                               channel.country === selectedCountry || 
                               channel.name.includes(selectedCountry) || 
                               channel.group.includes(selectedCountry);
            
            const categoryMatch = selectedCategory === 'Все' || 
                                channel.category === selectedCategory || 
                                channel.name.includes(selectedCategory) || 
                                channel.group.includes(selectedCategory);
            
            return countryMatch && categoryMatch;
        });

        filteredChannels.forEach((channel, index) => {
            const listItem = document.createElement('li');
            listItem.dataset.index = index;
            
            if (channel.logoUrl) {
                const logoImg = document.createElement('img');
                logoImg.src = channel.logoUrl;
                logoImg.classList.add('channel-logo');
                logoImg.onerror = () => { logoImg.style.display = 'none'; };
                listItem.appendChild(logoImg);
            }
            
            const nameSpan = document.createElement('span');
            nameSpan.textContent = channel.name;
            nameSpan.classList.add('channel-name');
            listItem.appendChild(nameSpan);
            
            listItem.addEventListener('click', () => {
                selectChannel(index);
            });
            
            channelList.appendChild(listItem);
        });

        // Выбрать первый канал по умолчанию
        if (filteredChannels.length > 0) {
            selectChannel(0);
        } else {
            mainVideo.src = '';
            const listItem = document.createElement('li');
            listItem.textContent = 'Нет каналов, соответствующих выбранным критериям';
            channelList.appendChild(listItem);
        }
    }

    function selectChannel(index) {
        if (filteredChannels.length === 0) return;
        
        currentChannelIndex = (index + filteredChannels.length) % filteredChannels.length;
        const selectedChannel = filteredChannels[currentChannelIndex];
        
        // Обновляем активный элемент в списке
        Array.from(channelList.children).forEach((item, i) => {
            item.classList.toggle('active', i === currentChannelIndex);
        });
        
        mainVideo.src = selectedChannel.url;
        mainVideo.load();
        mainVideo.play().catch(e => console.log('Autoplay prevented:', e));
    }

    // Обработчики выбора страны
    countrySelector.addEventListener('click', event => {
        if (event.target.tagName === 'BUTTON') {
            countrySelector.querySelectorAll('button').forEach(button => button.classList.remove('active'));
            event.target.classList.add('active');
            loadChannelList();
        }
    });

    // Обработчики выбора категории
    categorySelector.addEventListener('click', event => {
        if (event.target.tagName === 'BUTTON') {
            categorySelector.querySelectorAll('button').forEach(button => button.classList.remove('active'));
            event.target.classList.add('active');
            loadChannelList();
        }
    });

    // Обработчик выбора плейлиста
    playlistSelect.addEventListener('change', event => {
        if (event.target.value) {
            loadPlaylist(event.target.value);
        }
    });

    // Кнопки переключения каналов
    prevButton.addEventListener('click', () => selectChannel(currentChannelIndex - 1));
    nextButton.addEventListener('click', () => selectChannel(currentChannelIndex + 1));

    // Горячие клавиши
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
            selectChannel(currentChannelIndex - 1);
        } else if (e.key === 'ArrowRight') {
            selectChannel(currentChannelIndex + 1);
        }
    });

    // Инициализация - загрузка списка плейлистов
    loadPlaylists();
</script>

</body>
</html>
