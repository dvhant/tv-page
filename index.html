<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
        }

        #main-video-container {
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: hidden;
        }

        #main-video {
            width: 100%;
            height: auto;
        }

        #small-videos-container {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 60vh;
            left: 10px;
            right: 10px;
            height: 20vh;
        }

        .small-video {
            width: 48%;
            height: 100%;
            position: relative;
        }

        .small-video video {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        #controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #controls button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        #status {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            z-index: 10;
        }

        #countries {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 16px;
            text-align: center;
        }

        #categories {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 16px;
            text-align: center;
        }

        #channel-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 16px;
            text-align: center;
        }

        #channel-list li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #channel-list li:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<div id="main-video-container">
    <video id="main-video" controls autoplay muted></video>
</div>

<div id="small-videos-container">
    <div class="small-video"><video autoplay muted></video></div>
    <div class="small-video"><video autoplay muted></video></div>
</div>

<div id="controls">
    <button id="prev-channel">CH-</button>
    <button id="next-channel">CH+</button>
</div>

<div id="status">Статус: Ожидание...</div>

<div id="countries">
    <label for="country-select">Выберите страну:</label>
    <select id="country-select">
        <option value="all">Все страны</option>
        <option value="Russia">Россия</option>
        <option value="Belarus">Беларусь</option>
        <option value="China">Китай</option>
        <option value="Other">Другие</option>
    </select>
</div>

<div id="categories">
    <label for="category-select">Выберите категорию:</label>
    <select id="category-select">
        <option value="all">Все категории</option>
        <option value="General">Общие</option>
        <option value="News">Новости</option>
        <option value="Entertainment">Развлечения</option>
        <option value="Sport">Спорт</option>
    </select>
</div>

<ul id="channel-list"></ul>

<script>
    const mainVideo = document.getElementById('main-video');
    const smallVideo1 = document.querySelector('.small-video:first-child video');
    const smallVideo2 = document.querySelector('.small-video:last-child video');
    const prevButton = document.getElementById('prev-channel');
    const nextButton = document.getElementById('next-channel');
    const statusDiv = document.getElementById('status');
    const countrySelect = document.getElementById('country-select');
    const categorySelect = document.getElementById('category-select');
    const channelList = document.getElementById('channel-list');

    // Load playlist from local file
    let channels = [];
    fetch('combined.m3u') // Replace 'combined.m3u' with your actual file name
        .then(response => response.text())
        .then(data => {
            const lines = data.split('\n');
            let currentGroup = null;
            for (const line of lines) {
                if (line.startsWith('#EXTINF')) {
                    const [, logoUrl, name, tvgId] = line.match(/#EXTINF.*?tvg-logo="(.*?)".*?tvg-name="(.*?)".*?tvg-id="(.*?)"/) || [];
                    currentGroup = { name, logoUrl, tvgId };
                } else if (line.startsWith('http')) {
                    channels.push({ ...currentGroup, url: line });
                }
            }
            console.log('Каналы загружены:', channels);
            statusDiv.textContent = 'Статус: Каналы загружены';
        })
        .catch(error => {
            console.error('Ошибка при загрузке плейлиста:', error);
            statusDiv.textContent = 'Статус: Ошибка загрузки плейлиста';
        });

    let currentMainChannelIndex = 0;
    let intervalId;

    function switchChannel(index) {
        clearInterval(intervalId);
        currentMainChannelIndex = index % channels.length;
        loadMainVideo(channels[currentMainChannelIndex].url, channels[currentMainChannelIndex].name);
        loadSmallVideos();
        toggleRandomSwitch();
    }

    function loadMainVideo(url, name) {
        mainVideo.src = url;
        mainVideo.controls = true;
        mainVideo.autoplay = true;
        mainVideo.muted = false;
        mainVideo.load();
        statusDiv.textContent = `Статус: ${name}`;
    }

    function loadSmallVideos() {
        const randomChannels = [...channels];
        randomChannels.splice(currentMainChannelIndex, 1); // Exclude the main channel
        random.shuffle(); // Shuffle the array

        // Load two small videos with random channels
        smallVideo1.src = randomChannels[0]?.url || '';
        smallVideo2.src = randomChannels[1]?.url || '';
    }

    function toggleRandomSwitch() {
        intervalId = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * channels.length);
            switchChannel(randomIndex);
        }, 7000);
    }

    Array.prototype.shuffle = function() {
        for (let i = this.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [this[i], this[j]] = [this[j], this[i]];
        }
    };

    // Handle CH+ and CH- buttons
    prevButton.addEventListener('click', () => switchChannel(currentMainChannelIndex - 1));
    nextButton.addEventListener('click', () => switchChannel(currentMainChannelIndex + 1));

    // Load default channel on page load
    window.onload = () => {
        if (channels.length > 0) {
            loadMainVideo(channels[currentMainChannelIndex].url, channels[currentMainChannelIndex].name);
            loadSmallVideos();
            toggleRandomSwitch();
        }
    };

    // Filter channels by country and category
    countrySelect.addEventListener('change', updateChannelList);
    categorySelect.addEventListener('change', updateChannelList);

    function updateChannelList() {
        const selectedCountry = countrySelect.value;
        const selectedCategory = categorySelect.value;

        // Clear existing list items
        channelList.innerHTML = '';

        // Filter channels based on selection
        const filteredChannels = channels.filter(channel => {
            return (selectedCountry === 'all' || channel.tvgId.includes(selectedCountry)) &&
                   (selectedCategory === 'all' || channel.tvgId.includes(selectedCategory));
        });

        // Populate the channel list
        filteredChannels.forEach(channel => {
            const listItem = document.createElement('li');
            listItem.textContent = channel.name;
            listItem.addEventListener('click', () => {
                switchChannel(filteredChannels.indexOf(channel));
            });
            channelList.appendChild(listItem);
        });
    }
</script>

</body>
</html>
