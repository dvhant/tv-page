<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            display: flex;
        }

        #main-video-container {
            flex: 3;
            height: 100vh;
            overflow: hidden;
        }

        #main-video {
            width: 100%;
            height: 100%;
        }

        #controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #controls button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        #right-panel {
            flex: 1;
            background-color: #f9f9f9;
            overflow-y: auto;
        }

        #country-selector, #category-selector {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        #country-selector button, #category-selector button {
            margin: 0 5px;
            padding: 5px 10px;
            border: 1px solid #000;
            background-color: #fff;
            cursor: pointer;
        }

        #channel-list {
            padding: 10px;
            list-style-type: none;
            margin: 0;
            padding-left: 0;
        }

        #channel-list li {
            padding: 5px 0;
            cursor: pointer;
        }

        #channel-list li:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

<div id="main-video-container">
    <video id="main-video" controls autoplay muted></video>
    <div id="controls">
        <button id="prev-channel">CH-</button>
        <button id="next-channel">CH+</button>
    </div>
</div>

<div id="right-panel">
    <!-- Выбор страны -->
    <div id="country-selector">
        <button data-country="Россия">Россия</button>
        <button data-country="Китай">Китай</button>
        <button data-country="США">США</button>
        <!-- Добавьте другие страны из плейлиста -->
    </div>

    <!-- Выбор категории -->
    <div id="category-selector">
        <button data-category="Новости">Новости</button>
        <button data-category="Спорт">Спорт</button>
        <button data-category="Фильмы">Фильмы</button>
        <button data-category="Музыка">Музыка</button>
        <!-- Добавьте другие категории из плейлиста -->
    </div>

    <!-- Список каналов -->
    <ul id="channel-list"></ul>
</div>

<script>
    const mainVideo = document.getElementById('main-video');
    const prevButton = document.getElementById('prev-channel');
    const nextButton = document.getElementById('next-channel');
    const countrySelector = document.getElementById('country-selector');
    const categorySelector = document.getElementById('category-selector');
    const channelList = document.getElementById('channel-list');

    let channels = [];
    let currentChannelIndex = 0;

    // Загрузка плейлиста
    fetch('combined.m3u')
        .then(response => response.text())
        .then(data => {
            const lines = data.split('\n');
            let currentGroup = null;

            for (const line of lines) {
                if (line.startsWith('#EXTINF')) {
                    const [, logoUrl, name] = line.match(/#EXTINF:-1 tvg-logo="(.*?)".*?,(.*)/) || [];
                    currentGroup = { name, logoUrl };
                } else if (line.startsWith('http')) {
                    channels.push({ ...currentGroup, url: line });
                }
            }

            console.log('Каналы загружены:', channels);

            // Инициализация списка каналов
            loadChannelList();
        })
        .catch(error => console.error('Ошибка при загрузке плейлиста:', error));

    function loadChannelList() {
        channelList.innerHTML = '';

        const selectedCountry = Array.from(countrySelector.children).find(button => button.classList.contains('active'))?.dataset.country || '';
        const selectedCategory = Array.from(categorySelector.children).find(button => button.classList.contains('active'))?.dataset.category || '';

        const filteredChannels = channels.filter(channel =>
            (!selectedCountry || channel.name.includes(selectedCountry)) &&
            (!selectedCategory || channel.name.includes(selectedCategory))
        );

        filteredChannels.forEach((channel, index) => {
            const listItem = document.createElement('li');
            listItem.textContent = channel.name;
            listItem.dataset.index = index;
            listItem.addEventListener('click', () => selectChannel(index));
            channelList.appendChild(listItem);
        });

        // Выбрать первый канал по умолчанию
        if (filteredChannels.length > 0) {
            selectChannel(0);
        }
    }

    function selectChannel(index) {
        currentChannelIndex = index % channels.length;
        const selectedChannel = channels[currentChannelIndex];
        mainVideo.src = selectedChannel.url;
        mainVideo.load();
        mainVideo.play();
    }

    // Обработчики выбора страны
    countrySelector.addEventListener('click', event => {
        if (event.target.tagName === 'BUTTON') {
            Array.from(countrySelector.children).forEach(button => button.classList.remove('active'));
            event.target.classList.add('active');
            loadChannelList();
        }
    });

    // Обработчики выбора категории
    categorySelector.addEventListener('click', event => {
        if (event.target.tagName === 'BUTTON') {
            Array.from(categorySelector.children).forEach(button => button.classList.remove('active'));
            event.target.classList.add('active');
            loadChannelList();
        }
    });

    // Кнопки переключения каналов
    prevButton.addEventListener('click', () => selectChannel(currentChannelIndex - 1));
    nextButton.addEventListener('click', () => selectChannel(currentChannelIndex + 1));
</script>

</body>
</html>
